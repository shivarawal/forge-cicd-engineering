name: Docker Build and Push

description: Build and optionally push Docker images

inputs:
  registry:
    description: Container registry
    required: false
    default: docker.io

  username:
    description: Registry username
    required: true

  password:
    description: Registry password or token
    required: true

  image-name:
    description: Docker image name
    required: true

  image-tag:
    description: Docker image tag
    required: true

  context:
    description: Build context
    required: false
    default: .

  dockerfile:
    description: Dockerfile path
    required: false
    default: Dockerfile

  push:
    description: Push image
    required: false
    default: "true"

outputs:
  image:
    description: Full image name
    value: ${{ steps.meta.outputs.image }}

runs:
  using: composite

  steps:

    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Build Docker Image
      shell: bash
      run: |
        docker build \
          -f "${{ inputs.dockerfile }}" \
          -t "${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}" \
          "${{ inputs.context }}"

    - name: Push Docker Image
      if: ${{ inputs.push == 'true' }}
      shell: bash
      run: |
        docker push "${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}"

    - id: meta
      shell: bash
      run: |
        echo "image=${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}" >> $GITHUB_OUTPUT
