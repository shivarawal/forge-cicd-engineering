name: Docker Build and Push

description: Build and optionally push Docker images

inputs:
  registry:
    description: Container registry
    required: false
    default: docker.io

  username:
    description: Registry username
    required: true

  password:
    description: Registry password or token
    required: true

  image-name:
    description: Docker image name
    required: true

  image-tag:
    description: Docker image tag
    required: true

  context:
    description: Build context
    required: false
    default: .

  dockerfile:
    description: Dockerfile path
    required: false
    default: Dockerfile

  push:
    description: Push image
    required: false
    default: "true"

outputs:
  image:
    description: Full image name
    value: ${{ steps.image-output.outputs.image }}

runs:
  using: composite

  steps:

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Generate Docker Metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ inputs.image-name }}
        tags: |
          type=raw,value=${{ inputs.image-tag }}
          type=sha

    - name: Build Docker Image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}

        push: ${{ inputs.push == 'true' }}

        tags: ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}

        cache-from: type=gha
        cache-to: type=gha,mode=max

    - id: image-output
      shell: bash
      run: |
        echo "image=${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}" >> $GITHUB_OUTPUT
