name: Setup Environment
description: Prepare and validate the GitHub Actions runner

runs:
  using: composite

  steps:
    - name: Runner Information
      shell: bash
      run: |
        echo "========== Runner =========="
        echo "OS           : $RUNNER_OS"
        echo "Architecture : $RUNNER_ARCH"
        echo "Runner       : $RUNNER_NAME"

    - name: Repository Information
      shell: bash
      run: |
        echo "========== Repository =========="
        echo "Repository   : $GITHUB_REPOSITORY"
        echo "Branch       : $GITHUB_REF_NAME"
        echo "Actor        : $GITHUB_ACTOR"

    - name: Validate Git
      shell: bash
      run: |
        git --version

    - name: Validate Docker
      shell: bash
      run: |
        docker --version

    - name: Validate Curl
      shell: bash
      run: |
        curl --version

    - name: Validate Bash
      shell: bash
      run: |
        bash --version

    - name: Print Working Directory
      shell: bash
      run: |
        pwd
        ls -la
