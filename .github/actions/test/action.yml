name: setup environment for test
description: This workflow sets up the environment for testing purposes.

runs:
  using: composite

  steps:

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Check Node version
      shell: bash
      run: node --version

    - name: Check npm version
      shell: bash
      run: npm --version

    - name: Install dependencies
      shell: bash
      run: npm install
