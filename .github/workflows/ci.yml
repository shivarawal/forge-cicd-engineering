name: Forge CI

on:
  workflow_dispatch:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup and install dependencies
        uses: ./.github/actions/test
        with:
          path: examples/nodejs

      - name: Run tests
        shell: bash
        working-directory: examples/nodejs
        run: npm test
